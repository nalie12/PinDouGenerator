<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆工坊 · 拼豆图纸生成器</title>
<!-- SECTION: styles -->
<style>
:root{
  --paper:#ffffff; --panel:#ffffff;
  --ink:#000000; --ink2:#111111;
  --sand:#ffdd00; --sand-t:#ff69b4;
  --wine:#ffdd00; --wine-d:#ff69b4;
  --blue:#00bfff; --blue-t:#00bfff;
  --line:#000000; --line-strong:#000000;
  --r:8px;
  --dot:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Arial Black","Impact","Microsoft YaHei","PingFang SC",sans-serif;
  background:#ffffff; color:#000; user-select:none;
  display:flex; flex-direction:column; overflow:hidden; min-height:0;
  position:relative;
}
body::before,body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
}
body::before{
  background-image:radial-gradient(#000 1.15px, transparent 1.2px);
  background-size:var(--dot) var(--dot);
  opacity:.12;
}
body::after{
  background-image:radial-gradient(#ff69b4 1.15px, transparent 1.2px);
  background-size:var(--dot) var(--dot);
  background-position:calc(var(--dot)/2) calc(var(--dot)/2);
  opacity:.08;
}
.app,header,.palette-pop,#toast{position:relative;z-index:1}
/* SECTION: scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#000;border:3px solid #fff;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:#ff69b4}
::-webkit-scrollbar-corner{background:transparent}

/* SECTION: header */
header{
  display:flex;align-items:baseline;gap:14px;padding:14px 22px;flex:none;
  background:#ffdd00;border-bottom:4px solid #000;position:relative;z-index:2;
}
.logo{width:18px;height:18px;background:#ff69b4;flex:none;border:4px solid #000;box-shadow:3px 3px 0 #000}
header h1{font-size:22px;letter-spacing:.12em;color:#000;font-weight:900;text-transform:uppercase}
header .sub{font-size:11px;color:#000;padding:0;background:none;border:none;letter-spacing:.42em;font-weight:900;text-transform:uppercase}

/* SECTION: layout */
.app{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;padding:14px;min-height:0;overflow:hidden}
.panel{
  background:#fff;border:4px solid #000;border-radius:8px;
  box-shadow:6px 6px 0 #000;
  padding:14px;overflow-y:auto;min-height:0;
}
.sec{margin-bottom:18px}
.sec h3{font-size:12px;margin-bottom:9px;display:flex;align-items:center;gap:6px;color:#000;letter-spacing:.18em;border-bottom:4px solid #000;padding-bottom:6px;text-transform:uppercase;font-weight:900}
.sec h3::before{content:"";width:10px;height:10px;background:#ff69b4;border:3px solid #000;flex:none}
.sec h3 .tag{font-size:10px;color:#000;font-weight:900;text-transform:uppercase;letter-spacing:.12em}

/* SECTION: controls */
button{font-family:inherit;border:4px solid #000;cursor:pointer;color:#000;background:#ffdd00;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;line-height:1.2;box-shadow:4px 4px 0 #000;transition:transform .1s ease-out,box-shadow .1s ease-out,background .1s ease-out}button:hover{background:#ff69b4;color:#fff;transform:scale(1.1) rotate(-3deg);box-shadow:6px 6px 0 #000}button:active{background:#00bfff;color:#000;transform:scale(.95) rotate(2deg) translate(4px,4px);box-shadow:2px 2px 0 #000}button.on{background:#00bfff;color:#000}button.primary{background:#ff69b4;color:#fff}button.primary:hover{background:#00bfff;color:#000}button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 #000}.icon-btn{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;letter-spacing:0;text-transform:none}.icon-btn .ico{font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}.icon-btn svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.btnrow{display:flex;flex-wrap:wrap;gap:6px;min-width:0}.btnrow button{flex:1 1 100px;min-width:0;white-space:normal}.tool-strip{display:flex;flex-direction:column;gap:6px;min-width:0}#toolRow{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;padding-bottom:2px;-webkit-overflow-scrolling:touch}#toolRow button{flex:0 0 auto}#historyRow{margin-top:0}#historyRow button{flex:1 1 0;min-width:0}.mobile-actions{display:none}
input[type=number]{
  width:64px;border:4px solid #000;border-radius:8px;padding:6px 8px;font-size:13px;
  font-family:inherit;color:#000;background:#fff;outline:none;font-weight:700;
}
input[type=number]:focus{border-color:#ff69b4;box-shadow:4px 4px 0 #ff69b4}
input[type=range]{accent-color:#ff69b4;width:100%}
.note{font-size:11px;color:#000;background:#ffdd00;border:4px solid #000;border-radius:8px;padding:7px 9px;margin-top:8px;line-height:1.6;font-weight:700}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:#000;margin-bottom:6px;font-weight:700}
.seg{display:flex;background:#fff;border:4px solid #000;border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:4px solid transparent;background:#fff;padding:6px 4px;border-radius:8px;color:#000;box-shadow:none}
.seg button.on{background:#00bfff;color:#000;border-color:#000;box-shadow:2px 2px 0 #000}
.seg button:hover{transform:scale(1.08) rotate(-3deg);box-shadow:4px 4px 0 #000}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:6px 2px;font-weight:900;text-transform:uppercase}
.switch .dot{width:36px;height:20px;border-radius:8px;background:#fff;border:4px solid #000;position:relative;transition:.1s ease-out;flex:none;cursor:pointer}
.switch .dot::after{content:"";position:absolute;width:10px;height:10px;border-radius:4px;background:#000;border:none;top:1px;left:2px;transition:.1s ease-out}
.switch input{display:none}
.switch input:checked + .dot{background:#ff69b4;border-color:#000}
.switch input:checked + .dot::after{left:18px;background:#fff}
.cur-color{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid #000;border-radius:8px;padding:8px 10px;margin-bottom:8px;box-shadow:4px 4px 0 #000}
.cur-chip{width:34px;height:34px;border-radius:8px;border:4px solid #000;flex:none}
.cur-color .code{font-size:15px;font-weight:900;color:#000;text-transform:uppercase}
.cur-color .hint{font-size:10px;color:#000;letter-spacing:.12em;font-weight:700;text-transform:uppercase}
.val-badge{font-size:11px;background:#00bfff;color:#000;border:4px solid #000;border-radius:8px;padding:2px 8px;font-weight:900}

/* SECTION: center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;border:4px solid #000;border-radius:8px;overflow:hidden;box-shadow:6px 6px 0 #000}
.zoombar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:4px solid #000;flex-wrap:wrap;background:#ffdd00}
.zoombar .zb-group{display:flex;align-items:center;gap:4px;background:#fff;border:4px solid #000;border-radius:8px;padding:3px}
.zoombar .zb-group button{border:none;background:transparent;box-shadow:none;border-radius:8px;padding:4px 10px;font-size:13px;min-width:34px;color:#000}
.zoombar .zb-group button:hover{background:#ff69b4;color:#fff;box-shadow:4px 4px 0 #000}
.zoombar .zlabel{font-size:12px;color:#000;min-width:46px;text-align:center;font-weight:900}
.zoombar .tip{font-size:11px;color:#000;margin-left:auto;letter-spacing:.12em;font-weight:900;text-transform:uppercase}
.mobile-actions{display:none;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.42);flex-wrap:wrap}
.mobile-actions button{flex:1 1 88px;min-width:0}
.mobile-actions .mobile-tool.on{background:var(--ink);color:#F5EFE6;border-color:var(--ink)}
.viewport{flex:1;overflow:auto;display:flex;position:relative;min-height:0;
  background-color:#fff;
  background-image:radial-gradient(#000 1px, transparent 1.2px),radial-gradient(#ff69b4 1px, transparent 1.2px);
  background-size:16px 16px,16px 16px;background-position:0 0,8px 8px;
  cursor:default;overscroll-behavior:none;touch-action:none}
.stage-wrap{margin:auto;padding:20px;display:grid;grid-template-columns:28px max-content;grid-template-rows:28px max-content;width:max-content}
.stage-wrap.no-rulers{grid-template-columns:0 max-content;grid-template-rows:0 max-content}
.stage-wrap.no-rulers .ruler-corner,.stage-wrap.no-rulers .ruler-top,.stage-wrap.no-rulers .ruler-left{display:none}
.ruler-corner{grid-area:1/1}
.ruler-top{grid-area:1/2}
.ruler-left{grid-area:2/1}
.stage{grid-area:2/2;position:relative;box-shadow:6px 6px 0 #000;border-radius:8px;overflow:hidden;background:#fff;border:4px solid #000}
.stage canvas{position:absolute;left:0;top:0;display:block}
#gridCanvas{z-index:2}
.usage-bar{flex:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-top:1px solid var(--line-strong);background:#fff;min-width:0}
.usage-bar .usage-title{flex:none;font-size:11px;font-weight:900;color:var(--ink);letter-spacing:.08em}
.usage-bar .usage-sep{flex:none;width:1px;height:16px;background:var(--line-strong)}
.usage-bar .usage-track{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;display:flex;align-items:center;gap:10px}
.usage-bar .usage-track::-webkit-scrollbar{height:4px}
.usage-bar .usage-track::-webkit-scrollbar-thumb{background:rgba(26,26,46,.25);border:0}
.usage-item{flex:none;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px;cursor:pointer;border:1px solid transparent}
.usage-item:hover{background:#f1c40f}
.usage-item i{width:14px;height:14px;border-radius:2px;border:1px solid rgba(26,26,46,.28);display:inline-block;flex:none}
.usage-item .u-code{font-size:11px;font-family:Consolas,"Courier New",monospace;font-weight:700;color:var(--ink)}
.usage-item .u-cnt{font-size:11px;color:#666;margin-left:2px}
.usage-empty{font-size:11px;color:#888}
#refCanvas{z-index:1}

.palette-pop{
  position:fixed;z-index:140;display:flex;flex-direction:column;gap:6px;
  width:268px;max-height:60vh;padding:8px;
  background:#fff;border:4px solid #000;border-radius:8px;
  box-shadow:6px 6px 0 #000;
  visibility:hidden;opacity:0;pointer-events:none;
  transform:translateY(-4px);
  transition:opacity .1s ease-out,transform .1s ease-out,visibility .1s ease-out;
}
.palette-pop.open{visibility:visible;opacity:1;pointer-events:auto;transform:none}
.palette-pop-head{display:flex;flex-direction:column;gap:6px}
.palette-pop-head .pal-toggle{display:flex;gap:4px}
.palette-pop-head .pal-toggle button{flex:1;padding:4px 6px;font-size:11px}
.palette-pop-body{
  display:grid;grid-template-columns:repeat(12,16px);gap:2px;
  overflow:auto;padding:1px;min-height:0;
}
.palette-pop .swatch{
  width:16px;height:16px;padding:0;border-radius:4px;position:relative;
  overflow:hidden;cursor:pointer;border:2px solid #000;
  display:flex;align-items:flex-end;justify-content:center;box-shadow:none;
}
.palette-pop .swatch:hover{transform:scale(1.18) rotate(-3deg);z-index:2}
.palette-pop .swatch.sel{outline:4px solid #ff69b4;outline-offset:0;z-index:2}
.palette-pop .swatch .code{
  position:static;width:100%;font-size:6px;line-height:8px;font-weight:700;
  text-align:center;background:rgba(255,255,255,.7);pointer-events:none;
}
.palette-pop-footer{
  font-size:11px;color:#000;line-height:1.2;font-weight:900;text-transform:uppercase;
  padding:3px 6px;background:#ffdd00;border:4px solid #000;border-radius:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* SECTION: toast */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#ffdd00;color:#000;font-size:13px;padding:10px 22px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.1s ease-out;z-index:99;border:4px solid #000;letter-spacing:.12em;font-weight:900;box-shadow:4px 4px 0 #000;text-transform:uppercase;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1024px) and (orientation:landscape){
  .app{grid-template-columns:240px minmax(0,1fr);padding:10px;gap:10px}
}
@media (max-width:767px), (min-width:768px) and (max-width:1024px) and (orientation:portrait){
  html,body{overflow:hidden;height:100%;height:100dvh}
  header{flex-shrink:0;padding:10px 14px;gap:8px}
  header h1{font-size:16px;letter-spacing:2px}
  .app{
    display:flex;flex-direction:column;gap:0;padding:0;
    min-height:0;height:100%;overflow:hidden;
  }
  .center{
    order:-1;flex:none;flex-shrink:0;height:calc(55dvh + 36px);
    min-height:0;overflow:hidden;border-radius:0;border:none;
    border-bottom:4px solid #000;position:relative;
  }
  .usage-bar{flex-shrink:0;height:36px}
  .mobile-actions{display:none!important}
  .zoombar{
    position:absolute;right:8px;bottom:8px;z-index:6;
    display:flex;flex-direction:column;align-items:stretch;gap:4px;
    width:auto;max-width:calc(100% - 16px);padding:6px;
    background:#ffdd00;border:4px solid #000;
    border-radius:8px;box-shadow:4px 4px 0 #000;
  }
  .zoombar .tip{display:none}
  .zoombar .zb-group{justify-content:center}
  .zoombar button{font-size:14px;min-height:36px;padding-inline:10px}
  .viewport{flex:1;min-height:0;overflow:auto;overscroll-behavior:none;touch-action:none}
  .stage-wrap{padding:10px}
  #leftPanel{
    flex:1;min-height:0;width:100%;max-width:none;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y;border-radius:0;border:none;padding:12px 12px 20px;
  }
  #leftPanel::-webkit-scrollbar{width:6px}
  #leftPanel::-webkit-scrollbar-thumb{border-width:1px}
  .tool-strip{flex-direction:row;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  #toolRow,#historyRow{
    display:flex;flex-wrap:nowrap;overflow:visible;flex:1 1 auto;gap:6px;
  }
  #toolRow button,#historyRow button,.icon-btn{
    width:44px;height:44px;min-width:44px;flex:1 1 44px;
  }
  .btnrow button{flex-basis:calc(33.33% - 6px);font-size:14px;min-height:40px}
  #presetRow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #presetRow button{flex:none;width:100%}
  .field{flex-wrap:wrap;gap:8px;font-size:14px}
  .field input[type=range]{min-width:0;flex:1}
  input[type=number]{width:72px;font-size:16px;padding:8px}
  button{font-size:14px}
  .seg button{font-size:14px;padding:8px 6px}
  .switch{font-size:14px}
  .note{font-size:13px}
  .palette-pop{
    left:0!important;right:0!important;top:auto!important;bottom:0!important;
    width:100%!important;max-height:70vh;max-width:none;
    border-radius:0;padding:12px;
    transform:translateY(110%);opacity:1;visibility:visible;pointer-events:none;
  }
  .palette-pop.open{transform:translateY(0);pointer-events:auto}
  .palette-pop-body{grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:4px}
  .palette-pop .swatch{width:100%;height:28px}
  .palette-pop .swatch .code{font-size:8px;line-height:12px}
}
@media (prefers-reduced-motion:reduce){
  button,button:hover,button:active,.palette-pop,.palette-pop .swatch{transition:none;transform:none!important}
}

/* CEL SHADING OVERRIDE */

.zoombar{background:#4ea8de;border-bottom:3px solid #1a1a2e}.zoombar .zb-group{border:3px solid #1a1a2e;border-radius:0}.zoombar .zb-group button{border:0;color:#1a1a2e;background:#fff;box-shadow:none}.zoombar .zb-group button:hover{background:#f1c40f;color:#1a1a2e;box-shadow:2px 2px 0 #1a1a2e}

<body>
<!-- SECTION: header -->
<header>
  <span class="logo"></span>
  <h1>拼豆工坊</h1>
  <span class="sub">PERLER BEAD STUDIO</span>
</header>

<div class="app">
  <!-- SECTION: left-panel -->
  <aside class="panel" id="leftPanel">
    <div class="sec">
      <h3>当前颜色 & 工具</h3>
      <div class="cur-color">
        <div class="cur-chip" id="curChip"></div>
        <div>
          <div class="code" id="curCode">--</div>
          <div class="hint">点击调色盘按钮选择 MARD 色号</div>
        </div>
      </div>
      <div class="tool-strip">
      <div class="btnrow" id="toolRow">

  <div class="palette-pop-head">
    <div class="pal-toggle">
      <button id="palStd" class="on">常规 221 色</button>

<!-- SECTION: palette-data -->
<script src="assets/mard-palette.js"></script>
<!-- SECTION: app-script -->
<script>
(function(){
"use strict";
/* SECTION: state */
var PALETTE = window.MARD_COLORS;           // [{c:色号, h:HEX}]
var STD_COUNT = 221;                        // 前 221 色为常规色板
var BASE_CELL = 16;                         // 单元格固定 16px
var MAX_HISTORY = 50;
var LEVELS = [0.25,0.4,0.5,0.7,1,1.5,2,3,4];

var W=52, H=52;
var grid = new Int16Array(W*H).fill(-1);    // -1 = 空格子
var current = 135;                          // 默认选中色在色板中的索引（稍后校正为 F13）
var tool = 'brush';
var viewMode='block', showGrid=true, showRuler=true, showCodes=false;
var zoom = 1;
var undoStack=[], redoStack=[];
var fullPalette=false;
var refImg=null, refOpacity=0.5;
var lastCell=null, drawing=false, panning=false;

function findIdx(code){ for(var i=0;i<PALETTE.length;i++){ if(PALETTE[i].c===code) return i; } return 0; }
current = findIdx('F13');

/* SECTION: dom */
var $ = function(id){ return document.getElementById(id); };
var viewport=$('viewport'), stageWrap=$('stageWrap'), stage=$('stage');
var gridCanvas=$('gridCanvas'), refCanvas=$('refCanvas');
var rulerTop=$('rulerTop'), rulerLeft=$('rulerLeft');
var gctx=gridCanvas.getContext('2d'), rctx=refCanvas.getContext('2d');
var dpr = Math.max(1, window.devicePixelRatio||1);
var paletteDrawer=$('paletteDrawer');

function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); },1800);
}
function hexRgb(hex){
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function textColor(hex){
  var rgb=hexRgb(hex);
  return (rgb[0]*299+rgb[1]*587+rgb[2]*114)/1000>=150 ? '#20221f' : '#F0F0F0';
}
function cellPx(){ return BASE_CELL*zoom; }
function codeFont(size){
  return '700 '+size+'px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
}
function drawCodeLabel(ctx, code, cx, cy, cell, hex){
  var maxW=cell*0.88;
  var size=Math.max(10, Math.floor(cell*(String(code).length>3?0.32:0.4)));
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font=codeFont(size);
  while(size>10 && ctx.measureText(code).width>maxW){
    size--;
    ctx.font=codeFont(size);
  }
  var fill=textColor(hex);
  ctx.lineJoin='round';
  ctx.miterLimit=2;
  ctx.lineWidth=Math.max(2, size*0.16);
  ctx.strokeStyle=fill==='#0F414A'?'rgba(255,255,255,.86)':'rgba(12,20,24,.55)';
  ctx.strokeText(code, cx, cy);
  ctx.fillStyle=fill;
  ctx.fillText(code, cx, cy);
}
function exportCellSize(){
  var preferred=96;
  var maxSide=12288;
  var c=Math.min(preferred, Math.floor(maxSide/Math.max(W,H,1)));
  return Math.max(48, c);
}

/* SECTION: history */
function snapshot(){ return {W:W,H:H,arr:grid.slice()}; }
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length>MAX_HISTORY) undoStack.shift();
  redoStack.length=0;
  updateHistoryBtns();
}
function applySnap(s){
  W=s.W; H=s.H; grid=s.arr;
  $('sizeW').value=W; $('sizeH').value=H;
  syncPresetBtns();
  renderAll();
}
function undo(){
  if(!undoStack.length){ toast('没有可撤销的操作'); return; }
  redoStack.push(snapshot());
  applySnap(undoStack.pop());
  updateHistoryBtns();
}
function redo(){
  if(!redoStack.length){ toast('没有可重做的操作'); return; }
  undoStack.push(snapshot());
  applySnap(redoStack.pop());
  updateHistoryBtns();
}
function updateHistoryBtns(){
  $('undoBtn').disabled=!undoStack.length;
  $('redoBtn').disabled=!redoStack.length;
}

/* SECTION: canvas-render */
function sizeCanvas(cv,ctx,w,h){
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function drawRef(){
  var c=cellPx(), dw=W*c, dh=H*c;
  sizeCanvas(refCanvas,rctx,dw,dh);
  rctx.clearRect(0,0,dw,dh);
  if(!refImg) return;
  var s=Math.max(dw/refImg.width, dh/refImg.height);
  var sw=dw/s, sh=dh/s, sx=(refImg.width-sw)/2, sy=(refImg.height-sh)/2;
  rctx.globalAlpha=refOpacity;
  rctx.drawImage(refImg,sx,sy,sw,sh,0,0,dw,dh);
  rctx.globalAlpha=1;
}
function drawBead(ctx,cx,cy,r,hex){
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=hex; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  ctx.beginPath(); ctx.arc(cx-r*0.35,cy-r*0.35,r*0.55,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.34)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy+r*0.75,r*0.8,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.10)'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.26,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,.16)'; ctx.fill();
}
function drawGrid(){
  var c=cellPx(), w=W*c, h=H*c, i,x,y,v,hex;
  sizeCanvas(gridCanvas,gctx,w,h);
  gctx.clearRect(0,0,w,h);
  if(viewMode==='block'){
    for(i=0;i<grid.length;i++){
      v=grid[i]; if(v<0) continue;
      x=(i%W)*c; y=Math.floor(i/W)*c;
      gctx.fillStyle=PALETTE[v].h;
      gctx.fillRect(x,y,c,c);
    }
  }else{
    var r=c*0.44;
    for(i=0;i<grid.length;i++){
      v=grid[i]; if(v<0) continue;
      x=(i%W)*c+c/2; y=Math.floor(i/W)*c+c/2;
      drawBead(gctx,x,y,r,PALETTE[v].h);
    }
  }
  if(showGrid){
    gctx.lineWidth=1; gctx.strokeStyle='rgba(0,0,0,.18)';
    gctx.beginPath();
    for(i=1;i<W;i++){ if(i%5===0) continue; x=i*c; gctx.moveTo(x,0); gctx.lineTo(x,h); }
    for(i=1;i<H;i++){ if(i%5===0) continue; y=i*c; gctx.moveTo(0,y); gctx.lineTo(w,y); }
    gctx.stroke();
    gctx.lineWidth=2; gctx.strokeStyle='rgba(255,105,180,.55)';
    gctx.beginPath();
    for(i=5;i<W;i+=5){ x=i*c; gctx.moveTo(x,0); gctx.lineTo(x,h); }
    for(i=5;i<H;i+=5){ y=i*c; gctx.moveTo(0,y); gctx.lineTo(w,y); }
    gctx.stroke();
    gctx.lineWidth=2.5; gctx.strokeStyle='#000000';
    gctx.strokeRect(1,1,w-2,h-2);
  }
  if(showCodes && c>=11){
    for(i=0;i<grid.length;i++){
      v=grid[i]; if(v<0) continue;
      hex=PALETTE[v].h;
      drawCodeLabel(gctx, PALETTE[v].c, (i%W)*c+c/2, Math.floor(i/W)*c+c/2, c, hex);
    }
  }
}

/* SECTION: rulers */
function drawRulers(){
  var c=cellPx(), rw=Math.max(0,W*c), rh=Math.max(0,H*c), i,p;
  stageWrap.classList.toggle('no-rulers',!showRuler);
  if(!showRuler) return;
  sizeCanvas(rulerTop,rulerTop.getContext('2d'),rw,28);
  sizeCanvas(rulerLeft,rulerLeft.getContext('2d'),28,rh);
  var tc=rulerTop.getContext('2d'), lc=rulerLeft.getContext('2d');
  tc.setTransform(dpr,0,0,dpr,0,0); lc.setTransform(dpr,0,0,dpr,0,0);
  tc.clearRect(0,0,rw,28); lc.clearRect(0,0,28,rh);
  tc.fillStyle='rgba(255,255,255,.82)'; tc.fillRect(0,0,rw,28);
  lc.fillStyle='rgba(255,255,255,.82)'; lc.fillRect(0,0,28,rh);
  tc.font='700 9px sans-serif'; lc.font='700 9px sans-serif';
  for(i=0;i<=W;i++){
    p=i*c;
    var major=(i%5===0);
    tc.strokeStyle=major?'rgba(15,65,74,.75)':'rgba(15,65,74,.25)';
    tc.lineWidth=major?2:1;
    tc.beginPath(); tc.moveTo(p,28); tc.lineTo(p,major?6:18); tc.stroke();
    if(major){ tc.fillStyle='rgba(15,65,74,.8)'; tc.textAlign='left'; tc.textBaseline='top'; tc.fillText(String(i),p+3,2); }
  }
  for(i=0;i<=H;i++){
    p=i*c;
    var major2=(i%5===0);
    lc.strokeStyle=major2?'rgba(15,65,74,.75)':'rgba(15,65,74,.25)';
    lc.lineWidth=major2?2:1;
    lc.beginPath(); lc.moveTo(28,p); lc.lineTo(major2?6:18,p); lc.stroke();
    if(major2){
      lc.save(); lc.translate(2,p+3); lc.rotate(Math.PI/2);
      lc.fillStyle='rgba(15,65,74,.8)'; lc.textAlign='left'; lc.textBaseline='top';
      lc.fillText(String(i),0,0); lc.restore();
    }
  }
}

/* SECTION: stats-legend */
function computeCounts(){
  var map=new Map(), i,v;
  for(i=0;i<grid.length;i++){ v=grid[i]; if(v>=0) map.set(v,(map.get(v)||0)+1); }
  return map;
}
function usageList(){
  var map=computeCounts(), arr=[], total=0;
  map.forEach(function(n,v){ total+=n; arr.push({v:v,n:n}); });
  arr.sort(function(a,b){
    var ca=PALETTE[a.v]?PALETTE[a.v].c:'', cb=PALETTE[b.v]?PALETTE[b.v].c:'';
    return ca.localeCompare(cb, undefined, {numeric:true,sensitivity:'base'});
  });
  return {arr:arr,total:total};
}
function renderStats(){
  var track=$('usageTrack'); if(!track) return;
  var data=usageList();
  track.innerHTML='';
  if(!data.arr.length){
    var empty=document.createElement('span'); empty.className='usage-empty'; empty.textContent='画布暂无内容';
    track.appendChild(empty); return;
  }
  data.arr.forEach(function(e){
    var item=PALETTE[e.v]||{c:'自定义',h:'#888888'};
    var el=document.createElement('span'); el.className='usage-item'; el.title=item.c+' ×'+e.n;
    el.innerHTML='<i style="background:'+item.h+'"></i><span class="u-code">'+item.c+'</span><span class="u-cnt">×'+e.n+'</span>';
    el.addEventListener('click',function(){
      current=e.v; if(tool==='eraser') setTool('brush');
      buildPalette(); renderCur();
    });
    track.appendChild(el);
  });
}
var statsRaf=0;
function scheduleStats(){
  if(statsRaf) return;
  statsRaf=requestAnimationFrame(function(){ statsRaf=0; renderStats(); });
}

/* SECTION: palette-panel */
function buildPalette(){
  var box=$('paletteBody'); box.innerHTML='';
  var list=fullPalette?PALETTE:PALETTE.slice(0,STD_COUNT);
  list.forEach(function(item,idx){
    var d=document.createElement('button');
    d.type='button';
    d.className='swatch'+(idx===current?' sel':'');
    d.style.background=item.h;
    d.title=item.c+' '+item.h;
    var s=document.createElement('span'); s.className='code'; s.textContent=item.c;
    s.style.color=textColor(item.h);
    d.appendChild(s);
    d.addEventListener('click',function(e){
      e.stopPropagation();
      current=idx;
      if(tool==='eraser') setTool('brush');
      buildPalette(); renderCur();
      togglePalette(false);
    });
    box.appendChild(d);
  });
  updatePaletteFooter();
}
function updatePaletteFooter(){
  $('paletteSelCode').textContent=PALETTE[current].c;
  $('paletteSelHex').textContent=PALETTE[current].h;
}
function renderCur(){
  $('curChip').style.background=PALETTE[current].h;
  $('curCode').textContent=PALETTE[current].c;
  updatePaletteFooter();
}
function isCompactLayout(){
  var w=window.innerWidth, h=window.innerHeight;
  return w<=767 || (w>=768 && w<=1024 && h>=w);
}
function paletteAnchor(){
  return $('openPaletteBtn');
}
function positionPalette(){
  var pop=paletteDrawer;
  if(isCompactLayout()){
    pop.style.left='0px';
    pop.style.right='0px';
    pop.style.top='auto';
    pop.style.bottom='0px';
    pop.style.width='100%';
    return;
  }
  var btn=paletteAnchor(); if(!btn) return;
  var r=btn.getBoundingClientRect();
  var w=pop.offsetWidth||268, h=pop.offsetHeight||200;
  var left=r.left, top=r.bottom+4;
  if(left+w>window.innerWidth-8) left=Math.max(8, window.innerWidth-w-8);
  if(top+h>window.innerHeight-8) top=Math.max(8, r.top-h-4);
  pop.style.right='auto';
  pop.style.bottom='auto';
  pop.style.width='';
  pop.style.left=left+'px';
  pop.style.top=top+'px';
}
function togglePalette(open){
  var next=typeof open==='boolean'?open:!paletteDrawer.classList.contains('open');
  paletteDrawer.classList.toggle('open', next);
  if(next) positionPalette();
}
function syncPresetBtns(){
  $('presetRow').querySelectorAll('button').forEach(function(b){
    b.classList.toggle('on', +b.dataset.size===W && W===H);
  });
}

/* SECTION: render-all */
function renderAll(){
  var c=cellPx();
  stage.style.width=W*c+'px'; stage.style.height=H*c+'px';
  drawRef(); drawGrid(); drawRulers(); renderStats();
  $('zoomLabel').textContent=Math.round(zoom*100)+'%';
}
function zoomTo(z,keepCenter){
  var old=zoom;
  z=Math.min(LEVELS[LEVELS.length-1],Math.max(LEVELS[0],z));
  if(z===old) return;
  var cx=keepCenter?(viewport.scrollLeft+viewport.clientWidth/2)/(W*BASE_CELL*old):0.5;
  var cy=keepCenter?(viewport.scrollTop+viewport.clientHeight/2)/(H*BASE_CELL*old):0.5;
  zoom=z; renderAll();
  viewport.scrollLeft=cx*W*BASE_CELL*zoom-viewport.clientWidth/2;
  viewport.scrollTop=cy*H*BASE_CELL*zoom-viewport.clientHeight/2;
}
function zoomStep(dir){
  var i=0;
  for(var k=0;k<LEVELS.length;k++){ if(Math.abs(LEVELS[k]-zoom)<0.001){ i=k; break; } if(LEVELS[k]<zoom) i=k; }
  var ni=Math.min(LEVELS.length-1,Math.max(0,i+dir));
  zoomTo(LEVELS[ni],true);
}
function zoomFit(){
  var vw=viewport.clientWidth-56, vh=viewport.clientHeight-56;
  var z=Math.min(vw/(W*BASE_CELL),vh/(H*BASE_CELL));
  var best=LEVELS[0];
  for(var k=0;k<LEVELS.length;k++){ if(LEVELS[k]<=z+0.001) best=LEVELS[k]; }
  zoomTo(best,false);
  viewport.scrollLeft=0; viewport.scrollTop=0;
}

/* SECTION: drawing-tools */
function cellFromEvent(e){
  var rect=gridCanvas.getBoundingClientRect();
  var x=Math.floor((e.clientX-rect.left)/cellPx());
  var y=Math.floor((e.clientY-rect.top)/cellPx());
  if(x<0||y<0||x>=W||y>=H) return null;
  return y*W+x;
}
function paintLine(a,b,val){
  var x0=a%W, y0=Math.floor(a/W), x1=b%W, y1=Math.floor(b/W);
  var dx=Math.abs(x1-x0), dy=Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, e2;
  while(true){
    grid[y0*W+x0]=val;
    if(x0===x1&&y0===y1) break;
    e2=2*err;
    if(e2>-dy){ err-=dy; x0+=sx; }
    if(e2<dx){ err+=dx; y0+=sy; }
  }
}
function setTool(t){
  tool=t;
  $('toolRow').querySelectorAll('button').forEach(function(b){
    b.classList.toggle('on',b.dataset.tool===t);
  });
  document.querySelectorAll('.mobile-tool').forEach(function(b){
    b.classList.toggle('on',b.dataset.tool===t);
  });
  gridCanvas.style.cursor = t==='picker'?'copy':(t==='swap'?'pointer':'crosshair');
}
gridCanvas.addEventListener('pointerdown',function(e){
  if(e.button!==0) return;
  var idx=cellFromEvent(e); if(idx===null) return;
  e.preventDefault();
  gridCanvas.setPointerCapture(e.pointerId);
  if(tool==='picker'){
    var v=grid[idx];
    if(v>=0){ current=v; buildPalette(); renderCur(); toast('已吸取色号 '+PALETTE[v].c); setTool('brush'); }
    else toast('该位置为空，无颜色可吸取');
    return;
  }
  if(tool==='swap'){
    var old=grid[idx];
    if(old<0){ toast('该位置为空，请点击有颜色的格子'); return; }
    if(old===current){ toast('目标颜色与当前颜色相同'); return; }
    pushUndo();
    var n=0;
    for(var i=0;i<grid.length;i++){ if(grid[i]===old){ grid[i]=current; n++; } }
    drawGrid(); renderStats();
    toast('已将 '+n+' 颗 '+PALETTE[old].c+' 替换为 '+PALETTE[current].c);
    return;
  }
  drawing=true; lastCell=idx; pushUndo();
  paintLine(idx,idx,tool==='eraser'?-1:current);
  drawGrid(); scheduleStats();
});
gridCanvas.addEventListener('pointermove',function(e){
  if(!drawing) return;
  var idx=cellFromEvent(e); if(idx===null||idx===lastCell) return;
  paintLine(lastCell,idx,tool==='eraser'?-1:current);
  lastCell=idx;
  drawGrid(); scheduleStats();
});

function nearestIdx(r,g,b,pool){
  var best=pool[0],bd=Infinity;
  for(var k=0;k<pool.length;k++){
    var rgb=hexRgb(PALETTE[pool[k]].h);
    var d=(rgb[0]-r)*(rgb[0]-r)+(rgb[1]-g)*(rgb[1]-g)+(rgb[2]-b)*(rgb[2]-b);
    if(d<bd){ bd=d; best=pool[k]; }
  }
  return best;
}
$('convertFile').addEventListener('change',function(){
  var f=this.files[0]; var input=this; if(!f) return;
  var img=new Image();
  img.onload=function(){
    try{ convertImage(img); toast('转换完成，共用了 '+computeCounts().size+' 种颜色'); }
    catch(err){ toast('转换失败，请更换图片'); }
    input.value='';
  };
  img.onerror=function(){ toast('图片读取失败'); input.value=''; };
  img.src=URL.createObjectURL(f);
});
function convertImage(img){
  var off=document.createElement('canvas'); off.width=W; off.height=H;
  var oc=off.getContext('2d');
  var s=Math.max(W/img.width,H/img.height);
  var sw=W/s, sh=H/s, sx=(img.width-sw)/2, sy=(img.height-sh)/2;
  oc.drawImage(img,sx,sy,sw,sh,0,0,W,H);
  var data=oc.getImageData(0,0,W,H).data;
  var allIdx=[]; for(var k=0;k<PALETTE.length;k++) allIdx.push(k);
  var newGrid=new Int16Array(W*H).fill(-1);
  var counts=new Map();
  for(var i=0;i<W*H;i++){
    var a=data[i*4+3];
    if(a<120){ continue; }
    var r=data[i*4],g=data[i*4+1],b=data[i*4+2];
    var v=nearestIdx(r,g,b,allIdx);
    newGrid[i]=v;
    counts.set(v,(counts.get(v)||0)+1);
  }
  /* 避免大面积识别为白色：最高频色若接近白色且占比高，视为背景留空 */
  var maxV=-1,maxN=0,filled=0;
  counts.forEach(function(n,v){ filled+=n; if(n>maxN){ maxN=n; maxV=v; } });
  if(maxV>=0&&maxN>=filled*0.2){
    var wh=hexRgb(PALETTE[maxV].h);
    if(wh[0]>=235&&wh[1]>=235&&wh[2]>=235){
      for(var j=0;j<newGrid.length;j++){ if(newGrid[j]===maxV) newGrid[j]=-1; }
      counts.delete(maxV);
    }
  }
  /* 限制最大用色数：保留高频色，其余就近合并 */
  var maxN2=+$('maxColors').value;
  var kept=Array.from(counts.entries()).sort(function(a,b){ return b[1]-a[1]; }).map(function(e){ return e[0]; });
  if(kept.length>maxN2){
    var keepSet=kept.slice(0,maxN2);
    for(var m=0;m<newGrid.length;m++){
      var cv=newGrid[m];
      if(cv>=0&&keepSet.indexOf(cv)===-1){ newGrid[m]=nearestIdx(hexRgb(PALETTE[cv].h)[0],hexRgb(PALETTE[cv].h)[1],hexRgb(PALETTE[cv].h)[2],keepSet); }
    }
  }
  pushUndo();
  grid=newGrid; drawGrid(); renderStats();
}

/* SECTION: export */
function download(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}
$('exportPng').addEventListener('click',function(){
  var c=exportCellSize(), w=W*c, h=H*c, i,v,x,y,hex;
  var data=usageList();
  var pad = 42, chip = 40, gap = 30, lineH = 50, font = 36;//边距，色块，间距，行高，字号
  var tmp=document.createElement('canvas').getContext('2d');
  tmp.font='700 '+font+'px "Segoe UI","Microsoft YaHei",sans-serif';
  var rows=[{w:tmp.measureText('用料统计：').width+8, items:[]}];
  if(data.arr.length){
    data.arr.forEach(function(e){
      var item=PALETTE[e.v]||{c:'自定义',h:'#888888'};
      var label=item.c+' ×'+e.n;
      var iw=chip+6+tmp.measureText(label).width;
      var last=rows[rows.length-1];
      if(last.w+gap+iw>w-pad*2 && last.items.length){ rows.push({w:iw, items:[{item:item,n:e.n,iw:iw}]}); }
      else { last.items.push({item:item,n:e.n,iw:iw}); last.w+=gap+iw; }
    });
    var sum='共 '+data.total+' 颗 / '+data.arr.length+' 色';
    var sw=tmp.measureText(sum).width;
    var last2=rows[rows.length-1];
    if(last2.w+gap+sw>w-pad*2 && last2.items.length) rows.push({w:sw, items:[], sum:sum});
    else { last2.sum=sum; last2.w+=gap+sw; }
  }
  var statH=Math.max(44, pad*2 + rows.length*lineH + (rows.length-1)*8);
  var cv=document.createElement('canvas'); cv.width=w; cv.height=h+statH;
  var ctx=cv.getContext('2d');
  if(!ctx){ toast('当前浏览器无法导出图纸'); return; }
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h+statH);
  //色块图纸
  if(viewMode==='block'){
      for (i = 0; i < grid.length; i++) {
          v = grid[i];
          if (v < 0) continue;
          var x = (i % W) * c;
          var y = Math.floor(i / W) * c;
          ctx.fillStyle = PALETTE[v].h;
          ctx.fillRect(x, y, c, c);

          if (c >= 11) {
              drawCodeLabel(ctx, PALETTE[v].c, x + c/2, y + c/2, c, PALETTE[v].h);
          }
      }
  }
  //仿真圆豆模式
  else{
      for (i = 0; i < grid.length; i++) {
          v = grid[i];
          if (v < 0) continue;
          var cx = (i % W) * c + c / 2;
          var cy = Math.floor(i / W) * c + c / 2;
          drawBead(ctx, cx, cy, c * 0.44, PALETTE[v].h);

          if (c >= 11) {
              drawCodeLabel(ctx, PALETTE[v].c, cx, cy, c, PALETTE[v].h);
          }
      }
  }
  if(showGrid){
    ctx.lineWidth=Math.max(1, c/24); ctx.strokeStyle='rgba(0,0,0,.18)';
    ctx.beginPath();
    for(i=1;i<W;i++){ if(i%5===0) continue; x=i*c; ctx.moveTo(x,0); ctx.lineTo(x,h); }
    for(i=1;i<H;i++){ if(i%5===0) continue; y=i*c; ctx.moveTo(0,y); ctx.lineTo(w,y); }
    ctx.stroke();
    ctx.lineWidth=Math.max(2, c/16); ctx.strokeStyle='rgba(255,105,180,.55)';
    ctx.beginPath();
    for(i=5;i<W;i+=5){ x=i*c; ctx.moveTo(x,0); ctx.lineTo(x,h); }
    for(i=5;i<H;i+=5){ y=i*c; ctx.moveTo(0,y); ctx.lineTo(w,y); }
    ctx.stroke();
    ctx.lineWidth=Math.max(3, c/12); ctx.strokeStyle='#000000'; ctx.strokeRect(ctx.lineWidth/2,ctx.lineWidth/2,w-ctx.lineWidth,h-ctx.lineWidth);
  }
  ctx.fillStyle='#F7F7F4'; ctx.fillRect(0,h,w,statH);
  ctx.strokeStyle='rgba(26,26,46,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,h+0.5); ctx.lineTo(w,h+0.5); ctx.stroke();
  ctx.fillStyle='#1a1a2e'; ctx.font='700 '+font+'px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textBaseline='middle'; ctx.textAlign='left';
  if(!data.arr.length){
    ctx.fillText('空白图纸', pad, h+statH/2);
  }else{
    var yy=h+pad+lineH/2;
    rows.forEach(function(row,ri){
      var xx=pad;
      if(ri===0){ ctx.font='700 '+font+'px "Segoe UI","Microsoft YaHei",sans-serif';
          ctx.fillStyle='#1a1a2e';
          ctx.fillText('用料统计：', xx, yy);
          xx+=tmp.measureText('用料统计：').width+8; }
      row.items.forEach(function(it){
        ctx.fillStyle=it.item.h; ctx.fillRect(xx, yy-chip/2, chip, chip);
        ctx.strokeStyle='rgba(26,26,46,.28)'; ctx.strokeRect(xx+0.5, yy-chip/2+0.5, chip-1, chip-1);
        xx+=chip+6;
        ctx.fillStyle='#1a1a2e'; ctx.font='700 '+font+'px "Segoe UI","Microsoft YaHei",sans-serif';
        ctx.fillText(it.item.c, xx, yy);
        xx+=ctx.measureText(it.item.c).width+2;
        ctx.fillStyle='#666666'; ctx.font=font+'px "Segoe UI","Microsoft YaHei",sans-serif';
        ctx.fillText('×'+it.n, xx, yy);
        xx+=ctx.measureText('×'+it.n).width+gap;
      });
      if(row.sum){
          ctx.fillStyle = '#1a1a2e';
          ctx.font = '700 ' + (font * 1.6) + 'px "Segoe UI","Microsoft YaHei",sans-serif';
          ctx.fillText(row.sum, xx, yy);
      }
      yy+=lineH+8;
    });
  }
  cv.toBlob(function(blob){
    if(!blob){ toast('导出失败，请缩小画布后再试'); return; }
    download(blob,'拼豆图纸_'+W+'x'+H+'_MARD.png');
    toast('图纸 PNG 已导出');
  },'image/png');
});
$('exportTxt').addEventListener('click',function(){

  var total=0; arr.forEach(function(e){ total+=e[1]; });

  lines.push('--------------------------------');
  lines.push('色号\t颜色HEX\t数量(颗)');
  arr.forEach(function(e){
