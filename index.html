<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆工坊 · 拼豆图纸生成器</title>
<style>
:root{
  --paper:#ffffff;
  --ink:#000000;
  --red:#ff6b6b;
  --teal:#4ecdc4;
  --yellow:#ffe66d;
  --mint:#95e1d3;
  --coral:#f38181;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Arial Black","Microsoft YaHei","PingFang SC",sans-serif;
  background:#ffffff;
  color:#000;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
#landing{
  display:flex;
  height:100vh;
  height:100dvh;
  transition:opacity .5s ease;
}
#landing.leave{opacity:0;}
.col-left{
  width:44%;
  min-width:320px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  text-align:left;
  padding:48px 40px;
  background:#ffe66d;
  border-right:4px solid #000;
  position:relative;
}
.col-left::after{
  content:"";
  position:absolute;right:18px;top:28px;
  width:28px;height:28px;background:#ff6b6b;
  border:4px solid #000;
  transform:rotate(-2deg);
  box-shadow:6px 6px 0 #000;
}
.hero-title{
  font-weight:900;
  text-transform:uppercase;
  color:#000;
  font-size:clamp(48px, 6.6vw, 96px);
  letter-spacing:.04em;
  line-height:.95;
  transform:rotate(-2deg);
}
.hero-sub{
  margin-top:22px;
  font-family:Consolas,"Courier New",monospace;
  font-size:14px;
  letter-spacing:.18em;
  font-weight:700;
  background:#4ecdc4;
  color:#000;
  border:4px solid #000;
  padding:8px 12px;
  box-shadow:6px 6px 0 #000;
  transform:rotate(1deg);
}
.left-badge{margin-top:36px;display:flex;gap:10px;}
.left-badge i{
  width:18px;height:18px;
  border:4px solid #000;
  box-shadow:4px 4px 0 #000;
}
.left-badge i:nth-child(1){background:#ff6b6b;transform:rotate(-2deg);}
.left-badge i:nth-child(2){background:#4ecdc4;transform:rotate(1deg);}
.left-badge i:nth-child(3){background:#95e1d3;transform:rotate(-1deg);}
.col-right{
  flex:1;
  background:#ff6b6b;
  display:flex;
  flex-direction:column;
  position:relative;
}
.wall{flex:1;position:relative;overflow:hidden;}
.postcard{
  position:absolute;
  background:#fff;
  padding:10px 10px 14px;
  border:4px solid #000;
  border-radius:0;
  box-shadow:6px 6px 0 #000;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s cubic-bezier(.34,1.56,.64,1);
}
.postcard:nth-of-type(1){box-shadow:6px 6px 0 #4ecdc4;}
.postcard:nth-of-type(2){box-shadow:6px 6px 0 #ffe66d;}
.postcard:nth-of-type(3){box-shadow:6px 6px 0 #95e1d3;}
.postcard:nth-of-type(4){box-shadow:6px 6px 0 #f38181;}
.postcard:hover{
  transform:rotate(2deg) scale(1.05) translateY(-8px) !important;
  box-shadow:8px 8px 0 #000;
  z-index:9;
}
.postcard:active{transform:scale(.95) translate(4px,4px) !important;box-shadow:none;}
.postcard img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
.postcard .num{
  position:absolute;top:-12px;left:-8px;
  background:#ffe66d;color:#000;
  font-weight:900;font-size:12px;
  padding:4px 8px;
  border:4px solid #000;
  box-shadow:4px 4px 0 #000;
  transform:rotate(-2deg);
}
.postcard .cap{
  margin-top:8px;
  font-family:Consolas,"Courier New",monospace;
  color:#000;font-size:12px;font-weight:700;
}
.card-ph{
  display:none;width:100%;height:100%;
  background:#95e1d3;color:#000;
  align-items:center;justify-content:center;
  font-size:12px;font-weight:900;
}
.postcard.img-broken img{display:none;}
.postcard.img-broken .card-ph{display:flex;}
.ratio-34{aspect-ratio:3/4;}
.ratio-11{aspect-ratio:1/1;}
.enter-hint{
  position:absolute;right:22px;bottom:22px;
  padding:10px 14px;
  background:#ffe66d;color:#000;
  border:4px solid #000;
  border-radius:0;
  z-index:10;
  box-shadow:6px 6px 0 #000;
  transform:rotate(1deg);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.12em;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s cubic-bezier(.34,1.56,.64,1);
}
.enter-hint .hint-text{display:flex;align-items:center;gap:8px;font-size:13px;}
.enter-hint .chev{font-family:Consolas,"Courier New",monospace;}
.enter-hint:hover{transform:rotate(-2deg) scale(1.05) translateY(-8px);box-shadow:none;}
.enter-hint:active{transform:scale(.95) translate(4px,4px);box-shadow:none;}
@media (max-width:880px){
  #landing{flex-direction:column;}
  .col-left{width:100%;min-width:0;height:32vh;padding:24px;border-right:none;border-bottom:4px solid #000;}
  .hero-title{font-size:clamp(36px, 11vw, 56px);}
  .left-badge{display:none;}
  .wall{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px 20px 84px;align-content:start;}
  .postcard{position:static !important;left:auto !important;top:auto !important;width:auto !important;}
  .enter-hint{right:14px;bottom:16px;}
}
@media (prefers-reduced-motion:reduce){
  .postcard,.enter-hint,#landing{transition:none;}
  .postcard:hover,.enter-hint:hover{transform:none !important;}
}

/* CEL SHADING OVERRIDE */
:root{--paper:#fafaf5;--ink:#1a1a2e;--red:#e63946;--blue:#4ea8de;--green:#2ecc71;--yellow:#f1c40f}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
.col-left{background:#fafaf5;border-right:3px solid var(--ink);position:relative}
.col-left::before{background:var(--red);width:3px}
.col-left::after{background:var(--blue);border:3px solid var(--ink);border-radius:0;width:22px;height:22px;box-shadow:3px 3px 0 var(--ink)}
.hero-title{font-family:"Arial Black","Microsoft YaHei",sans-serif;color:var(--ink);font-weight:900;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;text-shadow:3px 3px 0 var(--red);transform:rotate(-1deg)}
.hero-sub{font-family:"Segoe UI",sans-serif;background:var(--blue);border:3px solid var(--ink);color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:900;letter-spacing:.18em;transform:rotate(1deg)}
.left-badge i{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.left-badge i:nth-child(1){background:var(--red)}.left-badge i:nth-child(2){background:var(--blue)}.left-badge i:nth-child(3){background:var(--green)}
.col-right{background:var(--red);box-shadow:none;border-left:3px solid var(--ink)}
.postcard{background:#fff;border:3px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink);transition:transform .075s linear,box-shadow .075s linear}
.postcard:nth-of-type(1){box-shadow:4px 4px 0 var(--blue)}.postcard:nth-of-type(2){box-shadow:4px 4px 0 var(--yellow)}.postcard:nth-of-type(3){box-shadow:4px 4px 0 var(--green)}.postcard:nth-of-type(4){box-shadow:4px 4px 0 var(--blue)}
.postcard:hover{transform:translate(2px,2px) scale(1.03)!important;box-shadow:1px 1px 0 var(--ink)}
.postcard .num{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.postcard img{border:3px solid var(--ink)}
.postcard .cap{font-family:"Segoe UI",sans-serif;font-weight:900;color:var(--ink)}
.enter-hint{background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink);transform:rotate(1deg);transition:all .075s linear;font-weight:900}
.enter-hint:hover{transform:translate(2px,2px) scale(1.03)!important;box-shadow:1px 1px 0 var(--ink)}
.enter-hint:active{transform:translate(4px,4px) scaleX(1.1) scaleY(.9);box-shadow:none}
@media (max-width:880px){.col-left{border-right:0;border-bottom:3px solid var(--ink)}.col-right{border-left:0}}
</style>
</head>
<body>
<div id="landing">
  <section class="col-left">
    <h1 class="hero-title">拼豆工坊</h1>
    <div class="hero-sub">PERLER BEAD PATTERN STUDIO</div>
    <div class="left-badge" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>
  <section class="col-right">
    <div class="wall" id="wall">
      <figure class="postcard ratio-34" style="width:34%;">
        <span class="num">01</span>
        <img alt="六件拼豆作品合集" src="assets/beads-set.jpg">
        <div class="card-ph">作品图</div>
      </figure>
      <figure class="postcard ratio-11" style="width:26%;">
        <span class="num">02</span>
        <img alt="黑白像素风格的嘴唇拼豆作品" src="assets/beads-lips.jpg">
        <div class="card-ph">作品图</div>
      </figure>
      <figure class="postcard ratio-34" style="width:36%;">
        <span class="num">03</span>
        <img alt="圆形构图的彩色港口小镇拼豆作品" src="assets/beads-harbor.jpg">
        <div class="card-ph">作品图</div>
      </figure>
      <figure class="postcard ratio-11" style="width:30%;">
        <span class="num">04</span>
        <img alt="红帽人像拼豆作品" src="assets/beads-hood.jpg">
        <div class="card-ph">作品图</div>
      </figure>
    </div>
    <button class="enter-hint" id="enterHint" aria-label="进入生成器">
      <span class="hint-text">START STUDIO</span>
    </button>
  </section>
</div>
<script>
document.querySelectorAll('.postcard img').forEach(function(img){
  img.addEventListener('error', function(){
    img.closest('.postcard').classList.add('img-broken');
  });
});
var cards = Array.prototype.slice.call(document.querySelectorAll('.postcard'));
var slots = [
  {left:'7%',  top:'9%',  r:-2},
  {left:'56%', top:'6%',  r:1},
  {left:'9%',  top:'52%', r:2},
  {left:'55%', top:'48%', r:-1}
];
function layout(order){
  cards.forEach(function(card, i){
    var s = slots[order[i]];
    card.style.left = s.left;
    card.style.top = s.top;
    card.style.transform = 'rotate(' + s.r + 'deg)';
  });
}
layout([0,1,2,3]);
var landing = document.getElementById('landing');
var navigating = false;
function enterGenerator(){
  if (navigating) return;
  navigating = true;
  landing.classList.add('leave');
  setTimeout(function(){ window.location.href = 'editor.html'; }, 500);
}
document.getElementById('enterHint').addEventListener('click', enterGenerator);
var touchStartX = 0, touchStartY = 0, touchActive = false;
landing.addEventListener('touchstart', function(e){
  touchActive = true;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
landing.addEventListener('touchend', function(e){
  if (!touchActive) return;
  touchActive = false;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (dy < -60 || dx < -60) enterGenerator();
}, {passive:true});
var wheelLock = false;
landing.addEventListener('wheel', function(e){
  if (wheelLock) return;
  if (e.deltaY > 30){ wheelLock = true; enterGenerator(); }
}, {passive:true});
</script>
</body>
</html>
